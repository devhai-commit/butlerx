<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom animation for the Voice Orb Pulse */
        @keyframes custom-pulse {
            0% { box-shadow: 0 0 20px 0px rgba(104, 51, 234, 0.4); transform: scale(0.98); }
            50% { box-shadow: 0 0 80px 20px rgba(104, 51, 234, 0.8); transform: scale(1.02); }
            100% { box-shadow: 0 0 20px 0px rgba(104, 51, 234, 0.4); transform: scale(0.98); }
        }
        .orb-listening {
            animation: custom-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Ambient Waveform Animations */
        @keyframes wave1 { 0%, 100% { height: 24px; opacity: 0.6; } 50% { height: 64px; opacity: 1; } }
        @keyframes wave2 { 0%, 100% { height: 40px; opacity: 0.7; } 50% { height: 80px; opacity: 1; } }
        @keyframes wave3 { 0%, 100% { height: 60px; opacity: 0.8; } 50% { height: 100px; opacity: 1; } }
        
        .bar-1 { animation: wave1 1.2s ease-in-out infinite; }
        .bar-2 { animation: wave2 1.4s ease-in-out infinite 0.2s; }
        .bar-3 { animation: wave3 1.1s ease-in-out infinite 0.4s; }
        .bar-4 { animation: wave2 1.3s ease-in-out infinite 0.1s; }
        .bar-5 { animation: wave1 1.5s ease-in-out infinite 0.3s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased h-screen w-screen overflow-hidden relative">
<!-- Mock Content Behind Overlay (Blurred out) -->
<div class="w-full h-full flex flex-col p-margin-page opacity-40">
<div class="h-64 w-full bg-surface-container rounded-3xl mb-stack-lg"></div>
<div class="h-32 w-full bg-surface-container-high rounded-3xl mb-stack-lg"></div>
<div class="h-32 w-full bg-surface-container rounded-3xl"></div>
</div>
<!-- 
      VOICE OVERLAY FULL SCREEN 
      - Full-screen dark tint (88% opacity via bg-inverse-surface/90)
      - 20px backdrop blur
    -->
<div class="fixed inset-0 z-[100] bg-inverse-surface/[0.88] backdrop-blur-[20px] flex flex-col items-center justify-between pt-24 pb-8 px-margin-page">
<!-- Top Spacer -->
<div class="w-full flex justify-center opacity-50">
<span class="text-on-primary font-label-xs text-label-xs tracking-widest uppercase">ButlerX Intelligence</span>
</div>
<!-- Center: Transcript Bubble -->
<div class="flex-1 w-full flex flex-col items-center justify-center -mt-12">
<div class="bg-surface-bright/10 backdrop-blur-3xl border border-surface-bright/20 rounded-3xl px-8 py-6 shadow-2xl relative overflow-hidden">
<!-- Inner soft highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>
<p class="font-title-md text-title-md text-surface-bright text-center">
                    " Đang nghe..."
                </p>
</div>
</div>
<!-- Bottom 30%: Voice Zone -->
<div class="h-[265px] w-full flex flex-col items-center justify-end relative pb-6">
<!-- Organic Waveforms -->
<div class="absolute bottom-32 left-0 w-full flex justify-center items-center gap-2 z-0">
<div class="w-2 rounded-full bg-tertiary-fixed-dim bar-1"></div>
<div class="w-2 rounded-full bg-tertiary bar-2"></div>
<div class="w-2 rounded-full bg-tertiary-container bar-3"></div>
<div class="w-2 rounded-full bg-tertiary-fixed bar-4"></div>
<div class="w-2 rounded-full bg-tertiary-fixed-dim bar-1"></div>
<div class="w-2 rounded-full bg-tertiary bar-3"></div>
<div class="w-2 rounded-full bg-tertiary-container bar-2"></div>
<div class="w-2 rounded-full bg-tertiary-fixed bar-5"></div>
</div>
<!-- Jarvis Orb (140px, Purple glowing) -->
<div class="relative w-[140px] h-[140px] rounded-full bg-gradient-to-tr from-tertiary to-tertiary-container flex items-center justify-center border-2 border-white/30 backdrop-blur-2xl z-10 orb-listening mb-stack-lg">
<!-- Inner orb core -->
<div class="w-24 h-24 rounded-full bg-gradient-to-br from-tertiary-fixed to-tertiary-container opacity-80 blur-md mix-blend-screen"></div>
<!-- Specular highlight -->
<div class="absolute top-4 left-6 w-8 h-4 rounded-full bg-white/40 blur-[2px] transform -rotate-45"></div>
</div>
<!-- Dismiss Indicator -->
<div class="flex flex-col items-center justify-center opacity-70 mt-4 cursor-pointer">
<span class="material-symbols-outlined text-outline-variant text-[28px] mb-1">keyboard_arrow_down</span>
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full"></div>
</div>
</div>
</div>
</body></html>
