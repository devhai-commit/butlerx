<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ButlerX - Chọn cá tính</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#00201a",
                        "primary": "#005bbf",
                        "background": "#f9f9ff",
                        "inverse-surface": "#2d3038",
                        "surface-container-high": "#e6e8f2",
                        "surface-dim": "#d8d9e3",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#ffffff",
                        "secondary": "#006b5c",
                        "surface-container": "#ecedf7",
                        "tertiary-fixed": "#e8deff",
                        "on-tertiary": "#ffffff",
                        "outline": "#727785",
                        "on-tertiary-fixed": "#20005f",
                        "surface-container-low": "#f2f3fd",
                        "surface-variant": "#e0e2ec",
                        "on-error": "#ffffff",
                        "tertiary": "#6833ea",
                        "outline-variant": "#c1c6d6",
                        "surface-tint": "#005bc0",
                        "primary-fixed-dim": "#adc7ff",
                        "secondary-container": "#68fadd",
                        "primary-container": "#1a73e8",
                        "secondary-fixed-dim": "#44ddc1",
                        "on-primary-fixed-variant": "#004493",
                        "secondary-fixed": "#68fadd",
                        "surface-bright": "#f9f9ff",
                        "on-secondary-container": "#007261",
                        "inverse-on-surface": "#eff0fa",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#cdbdff",
                        "error": "#ba1a1a",
                        "on-surface": "#191c23",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#8155ff",
                        "on-secondary-fixed-variant": "#005145",
                        "on-tertiary-fixed-variant": "#4f00d0",
                        "surface": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e0e2ec",
                        "inverse-primary": "#adc7ff",
                        "on-surface-variant": "#414754",
                        "on-tertiary-container": "#060021",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#191c23"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-grid": "16px",
                        "touch-target-min": "48px",
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "caption": ["Be Vietnam Pro"],
                        "label-xs": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "hero-lg-mobile": ["Be Vietnam Pro"],
                        "title-sm": ["Be Vietnam Pro"],
                        "title-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "hero-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "caption": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-xs": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "hero-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "title-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "hero-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Ambient Glow Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed/30 rounded-full blur-[100px] opacity-60"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-fixed/20 rounded-full blur-[120px] opacity-50"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-page pb-stack-lg pt-12 md:pt-24 max-w-lg mx-auto w-full h-full min-h-[884px]">
<!-- Header Section -->
<header class="text-center mb-12 w-full">
<h1 class="text-hero-lg-mobile md:text-hero-lg font-hero-lg-mobile md:font-hero-lg text-primary mb-stack-sm tracking-tight">Chọn cá tính cho trợ lý</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Để trải nghiệm tương tác tự nhiên và phù hợp nhất với bạn.</p>
</header>
<!-- Options Container -->
<div class="w-full space-y-stack-md flex-1 flex flex-col justify-center">
<!-- Option 1: Ổn định (Selected State Example) -->
<button class="w-full relative group rounded-2xl overflow-hidden transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-background">
<!-- Glass Background & Glow -->
<div class="absolute inset-0 bg-surface/80 backdrop-blur-3xl border border-primary/30 rounded-2xl z-0 shadow-[0_0_15px_rgba(0,91,191,0.15)] transition-all duration-300"></div>
<!-- Inner Active Gradient -->
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/10 to-transparent z-0 opacity-100 transition-opacity duration-300"></div>
<div class="relative z-10 flex items-center p-6 h-[88px]">
<div class="w-14 h-14 rounded-full bg-primary-container/20 flex items-center justify-center mr-stack-md shadow-inner">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<div class="text-left flex-1">
<h3 class="text-title-sm font-title-sm text-primary mb-1">Ổn định</h3>
<p class="text-caption font-caption text-on-surface-variant">Điềm tĩnh, rõ ràng và logic</p>
</div>
<!-- Selection Indicator -->
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 bg-primary rounded-full"></div>
</div>
</div>
</button>
<!-- Option 2: Năng động (Unselected State) -->
<button class="w-full relative group rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-background">
<!-- Glass Background & subtle shadow -->
<div class="absolute inset-0 bg-surface/50 backdrop-blur-2xl border border-white/40 rounded-2xl z-0 shadow-sm transition-all duration-300 group-hover:bg-surface/70 group-hover:shadow-[0_4px_20px_rgba(0,0,0,0.05)]"></div>
<div class="relative z-10 flex items-center p-6 h-[88px]">
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center mr-stack-md transition-colors duration-300 group-hover:bg-secondary-container/30">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary-container" style="font-variation-settings: 'FILL' 0;">Bookmark</span>
</div>
<div class="text-left flex-1">
<h3 class="text-title-sm font-title-sm text-on-surface mb-1 transition-colors duration-300 group-hover:text-primary">Năng động</h3>
<p class="text-caption font-caption text-on-surface-variant">Nhiệt huyết, nhanh nhẹn và vui vẻ</p>
</div>
<!-- Selection Indicator (Empty) -->
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-colors duration-300 group-hover:border-primary/50 flex items-center justify-center">
</div>
</div>
</button>
<!-- Option 3: Ấm áp (Unselected State) -->
<button class="w-full relative group rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-background">
<!-- Glass Background & subtle shadow -->
<div class="absolute inset-0 bg-surface/50 backdrop-blur-2xl border border-white/40 rounded-2xl z-0 shadow-sm transition-all duration-300 group-hover:bg-surface/70 group-hover:shadow-[0_4px_20px_rgba(0,0,0,0.05)]"></div>
<div class="relative z-10 flex items-center p-6 h-[88px]">
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center mr-stack-md transition-colors duration-300 group-hover:bg-tertiary-container/20">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-tertiary" style="font-variation-settings: 'FILL' 0;">favorite</span>
</div>
<div class="text-left flex-1">
<h3 class="text-title-sm font-title-sm text-on-surface mb-1 transition-colors duration-300 group-hover:text-primary">Ấm áp</h3>
<p class="text-caption font-caption text-on-surface-variant">Thân thiện, thấu hiểu và chu đáo</p>
</div>
<!-- Selection Indicator (Empty) -->
<div class="w-6 h-6 rounded-full border-2 border-outline-variant transition-colors duration-300 group-hover:border-primary/50 flex items-center justify-center">
</div>
</div>
</button>
</div>
<!-- Action Area (Bottom Pinned) -->
<div class="w-full mt-12 pb-stack-md flex flex-col gap-stack-sm">
<button class="w-full h-14 bg-gradient-to-r from-primary to-surface-tint text-on-primary rounded-xl text-body-sm font-body-sm font-semibold flex items-center justify-center hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 ring-offset-background shadow-[0_4px_14px_rgba(0,91,191,0.3)]">
                Tiếp tục
                <span class="material-symbols-outlined ml-2 text-xl" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="flex justify-center mt-4 space-x-2">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
</div>
</main>
</body></html>
