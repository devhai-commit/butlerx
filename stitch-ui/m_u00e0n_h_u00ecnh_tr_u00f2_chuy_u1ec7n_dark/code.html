<style>
        .glass-panel {
            background: rgba(29, 32, 36, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .orb-glow {
            box-shadow: 0 0 40px rgba(177, 204, 255, 0.3), inset 0 0 20px rgba(65, 228, 192, 0.2);
            background: radial-gradient(circle at 30% 30%, #a9c7ff, #295ea6);
        }
        .bot-msg-glow {
            box-shadow: 0 4px 24px rgba(41, 94, 166, 0.2);
            border: 1px solid rgba(65, 228, 192, 0.3);
        }
        .chip-gradient {
            background: linear-gradient(135deg, rgba(40, 42, 47, 0.6) 0%, rgba(25, 28, 32, 0.6) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md flex flex-col antialiased">
<!-- Top Navigation Placeholder (Desktop) -->
<nav class="hidden md:flex bg-surface/80 backdrop-blur-2xl fixed top-0 left-0 w-full z-50 justify-between items-center px-margin-desktop h-touch-target-min">
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<span class="text-headline-lg-mobile font-headline-lg-mobile text-primary">ButlerX</span>
</div>
<div class="flex gap-8">
<a class="text-on-surface-variant hover:opacity-80 transition-opacity text-label-md font-label-md" href="#">Trợ lý</a>
<a class="text-on-surface-variant hover:opacity-80 transition-opacity text-label-md font-label-md" href="#">Sức khỏe</a>
<a class="text-on-surface-variant hover:opacity-80 transition-opacity text-label-md font-label-md" href="#">Lịch trình</a>
<a class="text-on-surface-variant hover:opacity-80 transition-opacity text-label-md font-label-md" href="#">Cài đặt</a>
</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">settings</span>
</button>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full max-w-3xl mx-auto md:pt-touch-target-min pb-[100px] md:pb-[120px]">
<!-- Header: Jarvis Orb -->
<header class="flex flex-col items-center justify-center pt-12 pb-8 px-margin-mobile relative z-10">
<div class="w-24 h-24 rounded-full orb-glow mb-6 relative">
<div class="absolute inset-0 rounded-full bg-white/10 backdrop-blur-sm"></div>
</div>
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary text-center">Trợ lý ButlerX</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-2 text-center max-w-md">Sẵn sàng hỗ trợ bạn bất cứ lúc nào.</p>
</header>
<!-- Chat Area -->
<div class="flex-1 px-margin-mobile flex flex-col gap-6 overflow-y-auto relative z-10">
<!-- User Message -->
<div class="flex justify-end w-full">
<div class="bg-surface-container-high text-on-surface max-w-[85%] rounded-[18px] rounded-br-sm px-4 py-3 shadow-sm border border-outline-variant/20">
<p class="text-body-md font-body-md">Chào ButlerX, hôm nay tôi có hẹn gì không?</p>
</div>
</div>
<!-- Bot Message -->
<div class="flex justify-start w-full">
<div class="glass-panel bot-msg-glow max-w-[85%] rounded-[18px] rounded-bl-sm px-4 py-3 relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-primary to-secondary-container"></div>
<p class="text-body-md font-body-md text-on-surface ml-2">Chào Minh, bạn có hẹn khám sức khỏe lúc 2 giờ chiều nay.</p>
</div>
</div>
<!-- Suggestion Chips -->
<div class="flex flex-wrap gap-2 mt-8 justify-center">
<button class="chip-gradient border border-outline-variant/30 text-on-surface-variant rounded-full px-4 py-2 text-label-md font-label-md flex items-center gap-2 hover:bg-surface-container-highest transition-colors min-h-[40px]">
<span class="material-symbols-outlined text-[16px]">medication</span>
                    Nhắc tôi uống thuốc
                </button>
<button class="chip-gradient border border-outline-variant/30 text-on-surface-variant rounded-full px-4 py-2 text-label-md font-label-md flex items-center gap-2 hover:bg-surface-container-highest transition-colors min-h-[40px]">
<span class="material-symbols-outlined text-[16px]">restaurant</span>
                    Thực đơn tối nay
                </button>
<button class="chip-gradient border border-outline-variant/30 text-on-surface-variant rounded-full px-4 py-2 text-label-md font-label-md flex items-center gap-2 hover:bg-surface-container-highest transition-colors min-h-[40px]">
<span class="material-symbols-outlined text-[16px]">vital_signs</span>
                    Kiểm tra huyết áp
                </button>
</div>
</div>
</main>
<!-- Bottom Input Area -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-gradient-to-t from-background via-background to-transparent pt-8 pb-4 md:pb-8 px-margin-mobile">
<div class="max-w-3xl mx-auto relative">
<div class="glass-panel rounded-full flex items-center p-2 pl-4 shadow-lg border border-outline-variant/30">
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/60 h-touch-target-min" placeholder="Hỏi ButlerX..." type="text"/>
<button class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md hover:bg-primary/90 transition-colors shrink-0 ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
</div>
</body></html>
